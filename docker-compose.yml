services:
  db:
    image: postgis/postgis:15-3.3
    container_name: linkup-postgres
    environment:
      POSTGRES_USER: linkup
      POSTGRES_PASSWORD: password
      POSTGRES_DB: linkup
    ports:
      # Loopback only: the dev password is "password" and this is not meant to be
      # reachable from the rest of the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: linkup-redis
    ports:
      # Loopback only: this Redis has no password.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
