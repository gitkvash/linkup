name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing more: the job never needs to write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # ubuntu-latest ships Docker preinstalled and running, which Testcontainers
    # (used by the integration tests under AbstractIntegrationTest) requires.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        # surefire.excluded.groups skips @Tag("container") tests locally, where Docker
        # often isn't running; CI has Docker, so clear it or LinkupApplicationTests (a
        # container-tagged context-load test) never runs anywhere.
        run: ./mvnw -B verify -Dsurefire.excluded.groups=
