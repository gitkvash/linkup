server:
  port: ${PORT:8080}
  shutdown: graceful
  # Render terminates TLS and forwards; without this every request's remote address is
  # the proxy's, and the per-client rate limits on /auth would be one shared bucket.
  # Tomcat's RemoteIpValve only trusts X-Forwarded-For from private-range proxies.
  forward-headers-strategy: native

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: linkup

  profiles:
    # No profile set means local development: application-dev.yaml supplies the
    # dev-only secrets and verbose SQL logging. Deployments run with
    # SPRING_PROFILES_ACTIVE=prod, which loads none of that - so a missing
    # LINKUP_JWT_SECRET fails startup instead of silently signing tokens with a
    # key that is public in this repository's history.
    default: dev

  # The schema owner. Flyway and background work use this; request handling does NOT -
  # it uses the restricted role under linkup.datasource.app below, which is the one every
  # row-level policy actually applies to. See DataSourceConfig.
  datasource:
    url: ${LINKUP_DB_URL:jdbc:postgresql://localhost:5433/linkup}
    username: ${LINKUP_DB_USERNAME:linkup}
    password: ${LINKUP_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    # Given its own connection rather than reusing the primary DataSource bean: that bean
    # routes to the restricted role, which has no DDL rights by design.
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    placeholders:
      # Consumed by V17, which creates the role. Must not contain a single quote.
      app_db_password: ${LINKUP_APP_DB_PASSWORD:}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates the mapping matches it.
      ddl-auto: validate
    show-sql: false
    # A JDBC connection held for the whole request starves the pool under any load.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${LINKUP_REDIS_HOST:localhost}
      port: ${LINKUP_REDIS_PORT:6379}
      password: ${LINKUP_REDIS_PASSWORD:}
      ssl:
        enabled: ${LINKUP_REDIS_SSL:false}

  modulith:
    events:
      # Defaults to false, so the at-least-once delivery the fan-out and notification
      # listeners are documented to rely on did not actually exist: a publication left
      # incomplete by a crash was never retried. Property name verified against
      # spring-configuration-metadata.json in spring-modulith-events-core.
      #
      # Only safe with notification deduplication in place (V10's dedupe_key), or every
      # restart would redeliver and duplicate rows.
      republish-outstanding-events-on-restart: true
      # A completed publication is deleted rather than stamped. With UPDATE (the default)
      # nothing ever removed them, and event_publication kept a full serialized copy of
      # every event ever published.
      completion-mode: delete

management:
  endpoints:
    web:
      exposure:
        # Only health: anything else here is readable by any signed-up account, because
        # SecurityConfig only requires authentication and registration is open. Metrics
        # and prometheus exposed the full URI inventory and pool/JVM internals.
        include: health
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: ${LINKUP_TRACE_SAMPLING:0.1}

logging:
  pattern:
    level: "%5p [%X{traceId:-},%X{spanId:-}]"

linkup:
  datasource:
    # The role requests are served as: no ownership, no superuser, no BYPASSRLS. Startup
    # fails outside the dev profile if these are unset, rather than falling back to the
    # owner - an application accidentally running as a superuser looks perfectly healthy.
    #
    # Rollback for the whole least-privilege change: point these at the owner.
    app:
      username: ${LINKUP_APP_DB_USERNAME:linkup_app}
      password: ${LINKUP_APP_DB_PASSWORD:}
      # With the system pool (8) this is 13 per instance, under the 15 the Supabase
      # session pooler admits. Raise both only if the pooler's pool size goes up.
      max-pool-size: ${LINKUP_APP_DB_MAX_POOL_SIZE:5}
  security:
    jwt:
      # Intentionally no default. See spring.profiles.default above.
      secret: ${LINKUP_JWT_SECRET:}
      # 15 minutes. Refresh tokens are now tracked and revocable (V28), but an access
      # token is not checked against anything - its lifetime is the window a leaked or
      # signed-out one stays usable.
      expiration-ms: ${LINKUP_JWT_EXPIRATION_MS:900000}
      # 180 days, and sliding: every POST /auth/refresh issues a fresh one, so only
      # someone who hasn't opened the app for half a year has to sign in again.
      refresh-expiration-ms: ${LINKUP_JWT_REFRESH_EXPIRATION_MS:15552000000}
    google:
      # The Web OAuth client ID from Google Cloud Console - not secret, but still
      # externalized. This is the audience GoogleTokenVerifier checks ID tokens
      # against, and must match the serverClientId the Flutter client signs in with.
      client-id: ${LINKUP_GOOGLE_CLIENT_ID:}
  feed:
    ttl-days: ${LINKUP_FEED_TTL_DAYS:30}
    max-timeline-size: ${LINKUP_FEED_MAX_TIMELINE_SIZE:500}
    influencer-threshold: ${LINKUP_FEED_INFLUENCER_THRESHOLD:500}
  sse:
    # Emitters must expire: every open SSE connection pins a servlet request
    # thread, and the client reconnects automatically.
    timeout: ${LINKUP_SSE_TIMEOUT:PT15M}
  fcm:
    credentials-path: ${LINKUP_FCM_CREDENTIALS_PATH:}
  rate-limit:
    # In-memory, per instance (one Render instance today). Buckets are keyed by client IP
    # on /auth and by username on login.
    enabled: ${LINKUP_RATE_LIMIT_ENABLED:true}
    auth-per-ip:
      requests: 20
      window-seconds: 60
    login-per-username:
      requests: 10
      window-seconds: 900
    max-keys: 100000
  notification:
    # Push text is rendered on the server, so a plan's time has to be formatted in some
    # zone. The JVM's (UTC on Render) put Tbilisi users four hours off.
    zone: ${LINKUP_NOTIFICATION_ZONE:Asia/Tbilisi}
  places:
    sync:
      # Keeps the map's well-known places in step with OpenStreetMap, through the public
      # Overpass API (free, no key). See PlaceSyncJob. The defaults are safe for every
      # environment. Set LINKUP_PLACES_SYNC_ENABLED=false for a database whose places
      # shouldn't change.
      enabled: ${LINKUP_PLACES_SYNC_ENABLED:true}
      # Comma-separated, tried in order: the main public instance is often busy.
      overpass-url: ${LINKUP_PLACES_SYNC_OVERPASS_URL:https://overpass-api.de/api/interpreter,https://overpass.private.coffee/api/interpreter}
      # south,west,north,east rectangles, separated by ';'. Greater Tbilisi (Mtskheta and
      # the Tbilisi Sea included), Batumi, Kutaisi.
      areas: ${LINKUP_PLACES_SYNC_AREAS:41.60,44.60,41.87,45.05;41.56,41.55,41.70,41.72;42.20,42.60,42.32,42.80}
      # How old the last successful sync may get, and how often that is checked. A failed
      # sync is retried at the next check, not a week later.
      interval: ${LINKUP_PLACES_SYNC_INTERVAL:P7D}
      check-every: ${LINKUP_PLACES_SYNC_CHECK_EVERY:PT1H}
      initial-delay: PT1M
